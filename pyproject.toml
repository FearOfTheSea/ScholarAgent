[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scholar-agent"
version = "0.1.0"
description = "An educational clean-architecture foundation for an AI study assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.41,<5.0",
    "faiss-cpu>=1.8,<2.0",
    "fastapi>=0.112,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-text-splitters>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "streamlit>=1.37,<2.0",
    "torch>=2.0,<3.0",
    "transformers>=4.40,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2.0",
    "psutil>=6.0,<8.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
scholaragent-api = "scholar_agent.presentation.api.main:run"
scholaragent-web = "scholar_agent.presentation.web.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_runtime: requires locally installed Ollama and model weights",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["scholar_agent"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["dependency_injector.*", "streamlit"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true
